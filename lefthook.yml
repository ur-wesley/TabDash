pre-commit:
  commands:
    fmt:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,md}'
      run: bun x oxfmt --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: bun x oxlint {staged_files}

pre-push:
  commands:
    check:
      run: bun run check
