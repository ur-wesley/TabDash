pre-commit:
  commands:
    fmt:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,md}'
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    lint-fix:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    check:
      run: bun run check
